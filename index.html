<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0d"><title>Copycats HQ</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Copycats HQ">

<style>
:root{--bg:#09090b;--side:#0e0e12;--panel:#151519;--panel2:#1b1b21;--line:#2b2b33;--text:#f7f7f8;--muted:#9696a1;--gold:#f2bb52;--green:#53d593;--red:#ff6d74;--blue:#79aaff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:24px 14px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:20px;padding:0 10px 22px;display:flex;align-items:center;gap:10px}.brand img{width:38px;height:38px;object-fit:contain;border-radius:8px}.brand b{color:var(--gold)}
.nav button{display:flex;width:100%;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:11px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);color:#fff}
main{padding:28px 32px 100px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.top h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:4px}
.primary,.ghost,.danger{border-radius:11px;padding:10px 13px;cursor:pointer}.primary{border:0;background:var(--gold);color:#111;font-weight:800}.ghost{border:1px solid var(--line);background:transparent;color:#fff}.danger{border:1px solid #5a2d32;background:transparent;color:#ff9aa0}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px}.card{padding:17px}.k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.v{font-size:27px;font-weight:850;margin-top:7px}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.panel{overflow:hidden;margin-bottom:14px}.ph{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.ph h3{margin:0}.body{padding:16px}
table{width:100%;border-collapse:collapse}th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase}.scroll{overflow:auto}.empty{padding:28px;color:var(--muted);text-align:center}
.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#25252d;font-size:11px}.good{color:var(--green)}.warn{color:var(--gold)}.bad{color:var(--red)}
.attn{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.attn:last-child{border-bottom:0}.attn small{color:var(--muted)}
.showhero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.showhero h2{font-size:25px;margin:0 0 5px}.moneyrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.metric{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px}.metric strong{display:block;font-size:19px;margin-top:5px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}.detail{padding:9px 0;border-bottom:1px solid var(--line)}.detail span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}.dialog h2{margin:0 0 16px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}.field label{color:var(--muted);font-size:12px}.field input,.field select,.field textarea{border:1px solid var(--line);background:#0f0f12;color:#fff;border-radius:10px;padding:11px}.field textarea{min-height:90px}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.mobilebar{display:none}

.calbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}.calnav,.avail{display:flex;gap:8px;align-items:center}.calnav strong{min-width:150px;text-align:center;font-size:17px}.avail input{background:#0f0f12;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:10px 0 14px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line)}.dow{padding:10px;text-align:center;color:var(--muted);font-size:11px;text-transform:uppercase;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.day{min-height:112px;padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#111115;cursor:pointer;overflow:hidden}.day:hover{background:#17171c}.day.other{opacity:.35}.daynum{font-weight:800;margin-bottom:7px}.today .daynum{display:inline-flex;background:var(--gold);color:#111;width:25px;height:25px;border-radius:50%;align-items:center;justify-content:center}.event{font-size:11px;border-radius:7px;padding:5px 6px;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line)}.event.confirmed{background:#173126;color:#9be3bc;border-color:#28553c}.event.tentative{background:#332b18;color:#f5cf7a;border-color:#5a4923}.event.conflict{background:#3a1e22;color:#ffadb1;border-color:#653137}.event.completed{background:#202027;color:#aaa;border-color:#34343d}.availbox{margin-bottom:14px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:none}.availbox.show{display:block}
@media(max-width:850px){.app{display:block}aside{display:none}main{padding:19px 13px 95px}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.moneyrow{grid-template-columns:1fr}.details{grid-template-columns:1fr}.showhero{display:block}.showhero .primary{margin-top:12px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.mobilebar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#101014ef;backdrop-filter:blur(15px);border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.mobilebar button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:7px}.mobilebar button.active{color:var(--gold)}.top h1{font-size:24px}}

.contractgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.contractgrid .full{grid-column:1/-1}.contract-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.contract-result{margin-top:15px;padding:15px;border:1px solid #28553c;background:#13261d;border-radius:13px}.contract-result a{color:#9be3bc;text-decoration:none;font-weight:800}
@media(max-width:850px){.contractgrid{grid-template-columns:1fr}.contractgrid .full{grid-column:auto}}

.membergrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.memberpick{display:flex;gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:#101014}.bulkbox{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}.bulkfields{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.bulkfields .field input,.bulkfields .field select{width:100%}@media(max-width:850px){.membergrid{grid-template-columns:1fr}.bulkfields{grid-template-columns:1fr 1fr}}
.dashbrand{display:flex;align-items:center;gap:18px;padding:18px 20px;margin-bottom:16px;background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px}.dashbrand img{width:92px;height:92px;object-fit:contain}.dashbrand h2{margin:0;font-size:25px}.dashbrand p{margin:6px 0 0;color:var(--muted)}.dashactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:650px){.dashbrand img{width:68px;height:68px}.dashbrand h2{font-size:20px}}
.mobileMoreSheet{display:none}
@media(max-width:700px){
.mobileMoreSheet{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.58);align-items:flex-end}
.mobileMoreSheet.open{display:flex}
.mobileMoreCard{width:100%;max-height:76vh;overflow:auto;background:#151519;border:1px solid #303038;border-bottom:0;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px rgba(0,0,0,.5)}
.mobileMoreHandle{width:42px;height:5px;border-radius:99px;background:#44444d;margin:0 auto 13px}
.mobileMoreHead{display:flex;align-items:center;justify-content:space-between;padding:0 2px 14px}
.mobileMoreHead b{display:block;font-size:21px}.mobileMoreHead small{display:block;color:var(--muted);margin-top:2px}
.mobileMoreHead button{width:34px;height:34px;border-radius:50%;border:0;background:#27272d;color:#fff;font-size:22px}
.mobileMoreGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mobileMoreGrid>button{min-height:98px;padding:14px;background:#1d1d22;border:1px solid #303038;border-radius:16px;color:#fff;text-align:left}
.mobileMoreGrid>button span{display:block;color:var(--gold);font-size:21px;margin-bottom:8px}
.mobileMoreGrid>button b{display:block;font-size:14px}.mobileMoreGrid>button small{display:block;color:var(--muted);font-size:11px;line-height:1.25;margin-top:4px}
}

/* iPhone Home Screen safe-area fix */
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:#09090b}
@media (display-mode: standalone) and (max-width:700px){
  body{padding-top:var(--safe-top)!important}
  .mobilebar{
    padding-bottom:calc(10px + var(--safe-bottom))!important;
    min-height:calc(74px + var(--safe-bottom))!important
  }
  main,.main{padding-bottom:calc(100px + var(--safe-bottom))!important}
}

<script>
const COPYCATS_API_URL = "https://script.google.com/macros/s/AKfycby6S3VJ-RgR9TwUVHYeUPeHjugM4DPii_-NCjMpluJtgeAhYIh4F5J-pW76SbHGwByh/exec";

function copycatsGetPin() {
  let p = localStorage.getItem('copycats_hq_pin') || '';
  if (!p) {
    p = prompt('Copycats HQ PIN\n\nEnter the 6-digit PIN from your setup package:') || '';
    if (p) localStorage.setItem('copycats_hq_pin', p.trim());
  }
  return p.trim();
}
function copycatsResetPin() {
  localStorage.removeItem('copycats_hq_pin');
  location.reload();
}
function copycatsRpc(action, args, success, failure) {
  const pin = copycatsGetPin();
  if (!pin) {
    if (failure) failure(new Error('PIN required'));
    return;
  }

  const callback = '__copycats_cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
  const script = document.createElement('script');
  const timer = setTimeout(() => {
    cleanup();
    if (failure) failure(new Error('Could not reach Copycats HQ backend. Check that the new Apps Script version is deployed.'));
  }, 25000);

  function cleanup() {
    clearTimeout(timer);
    try { delete window[callback]; } catch(e) { window[callback] = undefined; }
    if (script.parentNode) script.parentNode.removeChild(script);
  }

  window[callback] = function(response) {
    cleanup();
    if (response && response.ok) {
      if (success) success(response.result);
    } else {
      const msg = response && response.error ? response.error : 'Unknown backend error';
      if (/Incorrect Copycats HQ PIN/i.test(msg)) localStorage.removeItem('copycats_hq_pin');
      if (failure) failure(new Error(msg));
      else alert(msg);
    }
  };

  const qs = new URLSearchParams({
    api:'1',
    action:action,
    args:JSON.stringify(args || []),
    pin:pin,
    callback:callback,
    t:String(Date.now())
  });
  script.src = COPYCATS_API_URL + '?' + qs.toString();
  script.onerror = function() {
    cleanup();
    if (failure) failure(new Error('Backend connection failed.'));
  };
  document.head.appendChild(script);
}

window.google = window.google || {};
google.script = google.script || {};
Object.defineProperty(google.script, 'run', {
  get: function() {
    let ok = null, fail = null;
    const chain = new Proxy({}, {
      get: function(target, prop) {
        if (prop === 'withSuccessHandler') return function(fn) { ok = fn; return chain; };
        if (prop === 'withFailureHandler') return function(fn) { fail = fn; return chain; };
        return function(...args) { copycatsRpc(String(prop), args, ok, fail); };
      }
    });
    return chain;
  }
});
</script>

let travelShowId='',travelDirection='ONWARDS';
function travelRowsForShow(){return (DATA.Travel||[]).filter(x=>String(x['Show ID'])===String(travelShowId))}
function travelPlanPage(){
 document.getElementById('sub').textContent='Build the whole band travel plan in a few clicks.';
 const shows=(DATA.Shows||[]).filter(x=>x.Status!=='Cancelled');if(!travelShowId&&shows.length)travelShowId=shows[0]['Show ID'];
 const rows=travelRowsForShow(),onward=rows.filter(x=>!String(x.Role||'').includes('[RETURN]')),ret=rows.filter(x=>String(x.Role||'').includes('[RETURN]'));
 document.getElementById('view').innerHTML=`<div class="panel"><div class="ph"><h3>Travel Plan Maker</h3><span class="pill">${rows.length} travel rows</span></div><div class="body"><div class="field" style="margin-bottom:14px"><label>Select Show</label><select onchange="travelShowId=this.value;travelPlanPage()">${shows.map(x=>`<option value="${x['Show ID']}" ${x['Show ID']===travelShowId?'selected':''}>${x['Event Date']||''} · ${x['Client Name']||''} · ${x.City||''}</option>`).join('')}</select></div>${shows.length?`<div class="quick"><button class="primary" onclick="openBandBulk('ONWARDS')">+ Add Entire Band — Onwards</button><button class="primary" onclick="openBandBulk('RETURN')">+ Add Entire Band — Return</button><button class="ghost" onclick="openApplyAll('ONWARDS')">Apply to All — Onwards</button><button class="ghost" onclick="openApplyAll('RETURN')">Apply to All — Return</button><button class="ghost" onclick="openTravelForm('ONWARDS')">+ One Traveller</button><button class="ghost" onclick="generateTravelPlanUI(event)">Export Travel Plan</button></div><div class="sub" style="margin-top:8px">Names come from Band Members. Enter common flight details once; seats, meals and remarks stay individual.</div>${travelSection('ONWARDS',onward)}${travelSection('RETURN',ret)}<div id="travelResult"></div>`:'<div class="empty">Create a confirmed Show first.</div>'}</div></div>`;
}
function bulkField(label,id,type,val){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${val||''}"></div>`}
function bulkSharedFields(){return `${bulkField('Date','b_date','date','')}${bulkField('From','b_from','text','')}${bulkField('To','b_to','text','')}${bulkField('Airline','b_airline','text','')}${bulkField('Flight Number','b_flight','text','')}${bulkField('Departure','b_departure','time','')}${bulkField('Arrival','b_arrival','time','')}<div class="field"><label>Class</label><select id="b_class"><option>Economy</option><option>Premium Economy</option><option>Business</option></select></div>${bulkField('PNR (if common)','b_pnr','text','')}<div class="field"><label>Booking Status</label><select id="b_status"><option>Not Booked</option><option>Booked</option><option>Changed</option></select></div>`}
function bulkValues(){const v=id=>(document.getElementById(id)||{}).value||'';return {date:v('b_date'),from:v('b_from'),to:v('b_to'),airline:v('b_airline'),flightNumber:v('b_flight'),departure:v('b_departure'),arrival:v('b_arrival'),travelClass:v('b_class'),pnr:v('b_pnr'),bookingStatus:v('b_status')}}
function modalButtons(saveLabel,saveFn){document.querySelector('.foot').innerHTML=`<button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="${saveFn}">${saveLabel}</button>`}
function openBandBulk(dir){
 travelDirection=dir;const members=(DATA['Band Members']||[]).filter(x=>String(x.Active||'Yes').toLowerCase()!=='no');
 if(!members.length){alert('Add your regular musicians once under Band Members first.');page='Band Members';render();return}
 document.getElementById('mtitle').textContent='Add Entire Band — '+dir;
 document.getElementById('form').innerHTML=`<div class="bulkbox"><b>1. Select travellers</b><div class="membergrid">${members.map((m,i)=>`<label class="memberpick"><input type="checkbox" class="bulkMember" data-i="${i}" checked><span><b>${m.Name||'Unnamed'}</b><br><small>${m.Role||''}</small></span></label>`).join('')}</div></div><div class="bulkbox"><b>2. Shared flight details</b><div class="bulkfields" style="margin-top:10px">${bulkSharedFields()}</div></div>`;
 modalButtons('Add Selected Band','saveBandBulk()');document.getElementById('modal').classList.add('open');window.bulkTravelModal=true;
}
function saveBandBulk(){const all=(DATA['Band Members']||[]).filter(x=>String(x.Active||'Yes').toLowerCase()!=='no');const sel=[...document.querySelectorAll('.bulkMember:checked')].map(x=>all[+x.dataset.i]).map(m=>({name:m.Name,role:m.Role}));google.script.run.withSuccessHandler(()=>{window.bulkTravelModal=false;closeModal();load()}).withFailureHandler(e=>alert(e.message)).addTravelBand(travelShowId,travelDirection,sel,bulkValues())}
function openApplyAll(dir){travelDirection=dir;document.getElementById('mtitle').textContent='Apply to All — '+dir;document.getElementById('form').innerHTML=`<div class="bulkbox"><b>Enter only the common flight details you want applied to every ${dir.toLowerCase()} traveller.</b><div class="bulkfields" style="margin-top:10px">${bulkSharedFields()}</div><div class="sub" style="margin-top:8px">Seat, meal and remarks are never overwritten.</div></div>`;modalButtons('Apply to Everyone','saveApplyAll()');document.getElementById('modal').classList.add('open');window.bulkTravelModal=true}
function saveApplyAll(){google.script.run.withSuccessHandler(()=>{window.bulkTravelModal=false;closeModal();load()}).withFailureHandler(e=>alert(e.message)).applyTravelToAll(travelShowId,travelDirection,bulkValues())}
function restoreModalButtons(){const f=document.querySelector('.foot');if(f)f.innerHTML='<button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveForm()">Save</button>'}
function travelSection(title,rows){
  return `<div class="panel" style="margin-top:15px"><div class="ph"><h3>${title}</h3><span class="pill">${rows.length}</span></div>${rows.length?`<div class="scroll"><table><thead><tr><th>Name</th><th>Date</th><th>From</th><th>To</th><th>Flight</th><th>Departure</th><th>Arrival</th><th>Seat / Meal</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.Person||'—'}</td><td>${r.Date||'—'}</td><td>${r.From||'—'}</td><td>${r.To||'—'}</td><td>${(r.Airline||'')+' '+(r['Flight Number']||'')}</td><td>${r.Departure||'—'}</td><td>${r.Arrival||'—'}</td><td>${[r.Seat,r.Meal].filter(Boolean).join(' · ')||'—'}</td><td>${r['Booking Status']||'—'}</td><td><button class="ghost" onclick="editTravel('${r['Travel ID']}')">Edit</button> <button class="danger" onclick="deleteTravel('${r['Travel ID']}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No '+title.toLowerCase()+' travel added yet.</div>'}</div>`;
}
function openTravelForm(dir,row={}){
  travelDirection=dir;
  editing=row&&row['Travel ID']?row:null;
  const role=String(row.Role||'').replace('[RETURN]','').trim();
  document.getElementById('mtitle').textContent=(editing?'Edit ':'Add ')+dir+' Travel';
  const f=[['Person','text',row.Person||''],['Role','text',role],['Date','date',String(row.Date||'').slice(0,10)],['From','text',row.From||''],['To','text',row.To||''],['Airline','text',row.Airline||''],['Flight Number','text',row['Flight Number']||''],['Departure','time',row.Departure||''],['Arrival','time',row.Arrival||''],['Class','text',row.Class||'Economy'],['Seat','text',row.Seat||''],['Meal','text',row.Meal||''],['PNR','text',row.PNR||''],['Booking Status','select:Not Booked|Booked|Changed',row['Booking Status']||'Not Booked'],['Remarks','textarea',row.Remarks||'']];
  document.getElementById('form').innerHTML=`<div class="formgrid">${f.map(([n,t,v])=>field(n,t,v)).join('')}</div>`;
  document.getElementById('modal').classList.add('open');
  window.travelModal=true;
}
function editTravel(id){const r=(DATA.Travel||[]).find(x=>x['Travel ID']===id);if(r)openTravelForm(String(r.Role||'').includes('[RETURN]')?'RETURN':'ONWARDS',r)}
function deleteTravel(id){if(!confirm('Delete this travel entry?'))return;google.script.run.withSuccessHandler(()=>load()).withFailureHandler(e=>alert(e.message)).deleteRecord('Travel',id)}
function saveTravelForm(){
  let rec=editing?{...editing}:{};
  document.querySelectorAll('#form [data-name]').forEach(x=>rec[x.dataset.name]=x.value);
  rec['Show ID']=travelShowId;
  rec.Role=(travelDirection==='RETURN'?'[RETURN] ':'')+(rec.Role||'');
  google.script.run.withSuccessHandler(()=>{window.travelModal=false;editing=null;closeModal();load()}).withFailureHandler(e=>alert(e.message)).upsertRecord('Travel',rec);
}
function generateTravelPlanUI(ev){
  const btn=ev.currentTarget;btn.disabled=true;btn.textContent='Exporting…';
  google.script.run.withSuccessHandler(r=>{btn.disabled=false;btn.textContent='Export Travel Plan';document.getElementById('travelResult').innerHTML=`<div class="contract-result"><b>Travel plan generated.</b><div class="quick"><a href="${r.sheetUrl}" target="_blank">Open Google Sheet ↗</a><a href="${r.pdfUrl}" target="_blank">Open PDF ↗</a></div></div>`;load()}).withFailureHandler(e=>{btn.disabled=false;btn.textContent='Export Travel Plan';alert(e.message)}).generateTravelPlan(travelShowId);
}

function deleteEnquiry(i){
  const e=(DATA.Enquiries||[])[i]; if(!e)return;
  const msg=e.Status==='Confirmed'
    ? 'Delete this enquiry? The linked confirmed Show will NOT be deleted.'
    : 'Delete this enquiry permanently?';
  if(!confirm(msg))return;
  google.script.run.withSuccessHandler(()=>load()).withFailureHandler(x=>alert(x.message)).deleteRecord('Enquiries',e['Enquiry ID']);
}
function openContractForShow(){page='Contract Designer';contractShowId=selectedShow['Show ID'];selectedShow=null;render()}
let contractShowId='';
function contractPage(){
  document.getElementById('sub').textContent='Create the right agreement for local Delhi or outstation shows.';
  const shows=(DATA.Shows||[]).filter(x=>x.Status!=='Cancelled');
  if(!contractShowId&&shows.length)contractShowId=shows[0]['Show ID'];
  const s=shows.find(x=>x['Show ID']===contractShowId)||{};
  const todayStr=ymdLocal(new Date());
  const lineup=(s['Band Lineup']||'').replace(/,\s*/g,'\n');

let calCursor=new Date();
function ymdLocal(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${da}`}
function calendarItems(){let a=[];(DATA.Shows||[]).forEach(s=>{if(s['Event Date'])a.push({date:String(s['Event Date']).slice(0,10),type:s.Status==='Completed'?'completed':'confirmed',label:s['Client Name']||'Show',showId:s['Show ID']})});(DATA.Enquiries||[]).forEach(e=>{if(e['Event Date']&&!['Confirmed','Lost'].includes(e.Status))a.push({date:String(e['Event Date']).slice(0,10),type:'tentative',label:e['Client Name']||'Enquiry',enquiryId:e['Enquiry ID']})});let c={};a.forEach(x=>c[x.date]=(c[x.date]||0)+1);a.forEach(x=>{if(c[x.date]>1&&x.type!=='completed')x.type='conflict'});return a}
function shiftMonth(n){calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+n,1);calendarPage()}
function calendarPage(){document.getElementById('sub').textContent='See bookings, holds and availability at a glance.';let y=calCursor.getFullYear(),m=calCursor.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),today=ymdLocal(new Date()),items=calendarItems(),cells='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=ymdLocal(d),di=items.filter(x=>x.date===ds);cells+=`<div class="day ${d.getMonth()!==m?'other':''} ${ds===today?'today':''}" onclick="dayClick('${ds}')"><div class="daynum">${d.getDate()}</div>${di.slice(0,3).map(x=>`<div class="event ${x.type}" onclick="event.stopPropagation();calendarEvent('${x.showId||''}','${x.enquiryId||''}')">${x.label}</div>`).join('')}</div>`}let month=first.toLocaleString('en-IN',{month:'long',year:'numeric'});document.getElementById('view').innerHTML=`<div class="calbar"><div class="calnav"><button class="ghost" onclick="shiftMonth(-1)">‹</button><strong>${month}</strong><button class="ghost" onclick="shiftMonth(1)">›</button><button class="ghost" onclick="calCursor=new Date();calendarPage()">Today</button></div><div class="avail"><input type="date" id="availDate"><button class="primary" onclick="checkAvailability()">Check Availability</button></div></div><div id="availbox" class="availbox"></div><div class="legend"><span><i class="dot" style="background:#53d593"></i>Confirmed</span><span><i class="dot" style="background:#f2bb52"></i>Tentative</span><span><i class="dot" style="background:#ff6d74"></i>Conflict</span><span><i class="dot" style="background:#777"></i>Completed</span><span>Empty = Available</span></div><div class="panel"><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div>`}
function calendarEvent(sid,eid){if(sid){openShowById(sid);return}if(eid){page='Enquiries';let i=(DATA.Enquiries||[]).findIndex(x=>x['Enquiry ID']===eid);if(i>=0){editing=DATA.Enquiries[i];openModal(editing)}}}
function dayClick(ds){let a=calendarItems().filter(x=>x.date===ds);if(a.length){checkAvailability(ds);return}page='Enquiries';editing=null;openModal({'Event Date':ds})}
function checkAvailability(forced){let ds=forced||(document.getElementById('availDate')||{}).value;if(!ds)return alert('Choose a date first.');let a=calendarItems().filter(x=>x.date===ds),box=document.getElementById('availbox');if(!box){page='Gig Calendar';calendarPage();box=document.getElementById('availbox')}let active=a.filter(x=>x.type!=='completed'),status=active.some(x=>x.type==='confirmed')?'BOOKED':active.length?'TENTATIVE / CONFLICT':'AVAILABLE';box.className='availbox show';box.innerHTML=`<div class="k">${ds}</div><div style="font-size:22px;font-weight:900;margin:5px 0" class="${status==='AVAILABLE'?'good':status==='BOOKED'?'bad':'warn'}">${status}</div>${a.map(x=>`<div>${x.label} · ${x.type}</div>`).join('')||'<div class="sub">No enquiry or show entered for this date.</div>'}<div class="quick"><button class="primary" onclick="page='Enquiries';editing=null;openModal({'Event Date':'${ds}'})">+ New Enquiry for this date</button></div>`}

function list(){let rows=DATA[page]||[];const pageSubs={Tasks:'See upcoming tasks',Releases:'See your upcoming releases',Jams:'See your upcoming jams',Projects:'See your upcoming projects',Enquiries:'Track every enquiry from first contact to confirmation.',Shows:'See confirmed and completed shows.','Band Members':'Keep your regular band roster ready to reuse.'};document.getElementById('sub').textContent=pageSubs[page]||'';if(page==='Tasks')rows=[...rows].sort((a,b)=>String(a['Due Date']||'9999').localeCompare(String(b['Due Date']||'9999')));if(page==='Releases')rows=[...rows].sort((a,b)=>String(a['Release Date']||'9999').localeCompare(String(b['Release Date']||'9999')));if(page==='Jams')rows=[...rows].sort((a,b)=>String(a.Date||'9999').localeCompare(String(b.Date||'9999')));if(page==='Projects')rows=[...rows].sort((a,b)=>String(a['Target Date']||'9999').localeCompare(String(b['Target Date']||'9999')));let cols=(fields[page]||[]).slice(0,6).map(x=>x[0]);if(page==='Shows')cols=['Event Date','City','Client Name','Performance Fee','Outstanding','Status'];document.getElementById('view').innerHTML=`<div class="panel"><div class="ph"><h3>${page}</h3><span style="color:var(--muted)">${rows.length} records</span></div>${rows.length?`<div class="scroll"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr ${page==='Shows'?`onclick="openShowById('${r['Show ID']}')" style="cursor:pointer"`:''}>${cols.map(c=>`<td>${['Performance Fee','Outstanding','Fee Quoted','Advance Received'].includes(c)?money(r[c]):r[c]||'—'}</td>`).join('')}<td><button class="ghost" onclick="event.stopPropagation();editRow(${i})">Edit</button>${page==='Enquiries'?` <button class="danger" onclick="event.stopPropagation();deleteEnquiry(${i})">Delete</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${({Tasks:'No upcoming tasks. Tap + Add when something comes up.',Releases:'No upcoming releases yet.',Jams:'No upcoming jams scheduled.',Projects:'No upcoming projects yet.'}[page]||'Nothing here yet. Tap + Add.')}</div>`}</div>`}

{detail('Band Lineup',s['Band Lineup'])}${detail('Sound Engineer',s['Sound Engineer'])}${detail('Technical Specs',s['Technical Specs'])}${detail('Notes',s.Notes)}</div></div><div class="panel"><div class="ph"><h3>Gig Checklist</h3></div><div class="body">${check('Contract signed',s['Contract Status']==='Signed')}${check('Flights booked',s['Flight Status']==='Booked')}${check('Travel ready',s['Travel Status']==='Ready')}${check('Payment cleared',(+String(s.Outstanding||0).replace(/[^0-9.-]/g,'')||0)<=0)}</div></div></div>`}
function detail(k,v){return `<div class="detail"><span>${k}</span>${v||'—'}</div>`} function check(t,ok){return `<div class="attn"><div>${ok?'✓':'○'} &nbsp;${t}</div><span class="${ok?'good':'warn'}">${ok?'Done':'Pending'}</span></div>`}

function field(n,t,v){v=String(v).replace(/"/g,'&quot;');if(t==='textarea')return `<div class="field full"><label>${n}</label><textarea data-name="${n}">${v}</textarea></div>`;if(t.startsWith('select:')){let o=t.split(':')[1].split('|');return `<div class="field"><label>${n}</label><select data-name="${n}">${o.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select></div>`}return `<div class="field"><label>${n}</label><input type="${t}" data-name="${n}" value="${v}"></div>`}
